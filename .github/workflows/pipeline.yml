name: Unified CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: /home/semillero/magno
  REPO_URL: github.com/UniversidadI/Magno.git
  INTERNAL_SSH_PASSWORD: ${{ secrets.INTERNAL_SSH_PASSWORD }}
  INTERNAL_USER: ${{ secrets.INTERNAL_USER }}
  INTERNAL_RESOURCE_IP: ${{ secrets.INTERNAL_RESOURCE_IP }}
  VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
  VPN_USER: ${{ secrets.VPN_USER }}
  VPN_HOST: ${{ secrets.VPN_HOST }}
  SERVER_CERT: ${{ secrets.SERVER_CERT }}

jobs:
  prepare:
    name: Prepare Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Verify Environment
        run: |
          echo "Preparing the build environment..."
          ls -R

  test-back:
    name: Test Backend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run Backend Tests
        env:
          SPRING_PROFILES_ACTIVE: test
          JDBC_DATABASE_USERNAME: sa
          JDBC_DATABASE_URL: jdbc:h2:mem:testdb
          INTEGRA_BASE_URL: http://localhost:8081
          INTEGRA_ACADEMIC_PROGRAMS_URL: http://localhost:8081/programs
          INTEGRA_ACADEMIC_PROGRAMS_ACADEMIA_URL: http://localhost:8081/academia
          INTEGRA_STUDENT_URL_1: http://localhost:8081/student1
          INTEGRA_STUDENT_URL_2: http://localhost:8081/student2
          INTEGRA_STUDENT_URL_ALL: http://localhost:8081/students
          INTEGRA_ALL_FUNCTIONARIES_URL: http://localhost:8081/functionaries
          INTEGRA_ALL_DEPENDENCIES_URL: http://localhost:8081/dependencies
          INTEGRA_API_TOKEN: test-token
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          FRONTEND_LOGIN_URL: http://localhost:3000/login
          FRONTEND_SUCCESS_URL: http://localhost:3000/
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test

  test-front:
    name: Test Frontend
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Prepare environment (VPN)
        run: sudo apt-get update && sudo apt-get install -y openconnect
      - name: Connect to VPN
        run: |
          echo "$VPN_PASSWORD" | sudo openconnect \
          --protocol=gp \
          --user=$VPN_USER \
          --passwd-on-stdin \
          --servercert "pin-sha256:$SERVER_CERT" \
          $VPN_HOST -b
          sleep 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm run lint
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Frontend Tests
        run: pnpm test

  deploy-back:
    name: Deploy Backend
    needs: test-back
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install sshpass and OpenConnect
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass
      - name: Connect to VPN
        run: |
          echo "$VPN_PASSWORD" | sudo openconnect \
          --protocol=gp \
          --os=win \
          --user="$VPN_USER" \
          --passwd-on-stdin \
          --servercert "pin-sha256:$SERVER_CERT" \
          "$VPN_HOST" -b
        
      - name: Test internal connectivity with SSH
        run: |
          sshpass -p "$INTERNAL_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $INTERNAL_USER@$INTERNAL_RESOURCE_IP 'echo "SSH connection successful"'
        
      - name: Send env file to server
        run: |
          # Create the .env.prod file locally first to avoid shell expansion issues
          cat << 'EOF_SECRET' > .env.prod
          ${{ secrets.APP_ENV_PROD }}
          EOF_SECRET

          sshpass -p "$INTERNAL_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $INTERNAL_USER@$INTERNAL_RESOURCE_IP mkdir -p "$APP_DIR"/backend
          sshpass -p "$INTERNAL_SSH_PASSWORD" scp -o StrictHostKeyChecking=no .env.prod $INTERNAL_USER@$INTERNAL_RESOURCE_IP:"$APP_DIR"/backend/.env.prod
        
      - name: Deploy to Remote Server
        run: |
          sshpass -p "$INTERNAL_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $INTERNAL_USER@$INTERNAL_RESOURCE_IP << 'EOF'
            set -e
            cd ~/magno/ || exit;
            if [ ! -d ".git" ]; then
              git clone git@github.com:JackBlaze132/Magno.git . || (git init && git remote add origin git@github.com:JackBlaze132/Magno.git && git pull origin main)
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            cd backend
            
            # Stop existing Java processes
            echo "Stopping existing applications..."
            pkill -f 'magno' || echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S pkill -f 'magno' || true
            
            # Stop Gradle daemons
            bash gradlew --stop 2>/dev/null || true
            
            # FIX PERMISSIONS: Take ownership of the entire backend folder
            # This fixes "Permission denied" errors on .gradle and build folders
            echo "Fixing file permissions..."
            echo "${{ secrets.INTERNAL_SSH_PASSWORD }}" | sudo -S chown -R $(whoami):$(whoami) . || true
            
            # Now we can safely clean up
            rm -rf .gradle build
            
            # Build without daemon
            echo "Building backend..."
            bash gradlew build -x test --no-daemon
            
            mkdir -p logs
            # .env.prod was already uploaded via scp

            echo "Starting Spring Boot application with Java 21..."
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            export PATH=$JAVA_HOME/bin:$PATH

            cd /home/semillero/magno/backend
            set -a && source .env.prod && set +a
            setsid java -jar build/libs/magno-0.0.1-SNAPSHOT.jar > magno.log 2>&1 </dev/null &
            
            echo "Backend started with setsid."
          EOF

  deploy-front:
    name: Deploy Frontend
    needs: test-front
    runs-on: ubuntu-latest
    steps:
      - name: Prepare environment (VPN & SSH)
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass
      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
          --protocol=gp \
          --user=${{ secrets.VPN_USER }} \
          --passwd-on-stdin \
          --servercert "pin-sha256:$SERVER_CERT" \
          ${{ secrets.VPN_HOST }} -b
          sleep 10
      - name: Deploy to Remote Server
        run: |
          # Create the file locally with proper escaping
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production

          # Create directory and transfer the file
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} "mkdir -p ~/magno/frontend"
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no .env.production ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }}:~/magno/frontend/.env.production

          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} << 'EOF'
            set -e
            cd ~/magno/ || exit;
            if [ ! -d ".git" ]; then
              git clone git@github.com:JackBlaze132/Magno.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            cd frontend
            # .env.production was already uploaded via scp
            
            rm -rf node_modules
            pnpm install --frozen-lockfile
            pnpm run build
            
            export PATH=$PATH:/usr/local/nodejs/bin
            if pm2 list | grep -q 'Front_Magno'; then
              pm2 restart Front_Magno
            else
              pm2 start 'npx -y serve -s dist -p 3000' --name Front_Magno
            fi
          EOF
